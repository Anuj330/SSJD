# Production stack for a single VM (e.g. Oracle Always Free).
#   docker compose -f docker-compose.prod.yml up -d --build
# App is served by the frontend container on port 80 (it proxies /api,/auth,...
# to the backend). Postgres is NOT exposed publicly — only reachable inside the
# compose network. Secrets come from ./deploy.env on the server (never committed).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy.env}
      POSTGRES_DB: ${POSTGRES_DB:-ssjd_db}
    # No `ports:` on purpose — the DB stays private to the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ssjd_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./SSJD backend
    restart: unless-stopped
    env_file:
      - ./deploy.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ssjd_db}
      SEED_ADMIN: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in deploy.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy.env}
      AADHAAR_DIR: /data/aadhaar
    volumes:
      - aadhaar_data:/data/aadhaar
    # No public port — only the frontend (nginx) talks to it.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./SSJD frontend/ssjd-app
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  aadhaar_data:
